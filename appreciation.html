<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>I Need Appreciation</title>
  <style>
    :root{--ink:#17131c;--cream:#fff8df;--pink:#ff4fd8;--cyan:#2ef2ff;--yellow:#fff500}*{box-sizing:border-box}body{margin:0;min-height:100vh;overflow:hidden;background:radial-gradient(circle at 15% 15%,rgba(46,242,255,.55) 0 7%,transparent 7.3%),radial-gradient(circle at 88% 76%,rgba(255,79,216,.48) 0 10%,transparent 10.4%),linear-gradient(135deg,#fff8df 0 52%,#f7ff9b 52%);color:var(--ink);font-family:Arial Black,Impact,sans-serif}.page{min-height:100vh;display:grid;place-items:center;padding:40px 20px;position:relative}.page:before{content:"";position:absolute;inset:0;opacity:.2;background-image:linear-gradient(var(--ink) 1px,transparent 1px),linear-gradient(90deg,var(--ink) 1px,transparent 1px);background-size:42px 42px}.hero{position:relative;text-align:center;width:min(920px,100%)}.tag{display:inline-block;padding:9px 14px;border:3px solid;background:white;box-shadow:5px 5px 0;margin-bottom:22px;font:800 13px Arial;letter-spacing:.12em;transform:rotate(-1deg)}h1{margin:0;font-size:clamp(56px,10vw,128px);line-height:.78;letter-spacing:-.07em;text-shadow:5px 5px white,9px 9px var(--ink);transform:rotate(-1deg)}h1 span{color:var(--pink);-webkit-text-stroke:3px var(--ink)}.sub{font:800 clamp(16px,2vw,22px) Arial;margin:30px 0 26px}#mainButton{width:min(720px,94vw);min-height:128px;padding:24px 30px;border:7px solid;border-radius:28px;background:var(--yellow);box-shadow:0 14px 0 var(--ink),0 20px 28px #17131c44;cursor:pointer;font:inherit;font-size:clamp(27px,4.8vw,58px);line-height:.95;transition:.13s}#mainButton:hover{background:var(--cyan);transform:translateY(-5px) rotate(-.5deg);box-shadow:0 19px 0 var(--ink)}#mainButton:active{transform:translateY(10px);box-shadow:0 4px 0 var(--ink)}.warning{font:700 12px Arial;letter-spacing:.08em;margin-top:28px}.overlay{position:fixed;inset:0;z-index:10;display:none;place-items:center;padding:20px;background:#17131ccc;backdrop-filter:blur(8px)}.overlay.show{display:grid;animation:arrive .25s}.card{position:relative;z-index:3;width:min(650px,94vw);max-height:92vh;overflow:auto;padding:25px;border:7px solid;border-radius:30px;background:var(--cream);text-align:center;box-shadow:14px 14px var(--pink),24px 24px var(--cyan);animation:pop .55s cubic-bezier(.2,1.7,.4,1)}.ribbon{display:inline-block;padding:8px 13px;background:var(--yellow);border:3px solid;font:900 12px Arial;letter-spacing:.1em;margin-bottom:17px}.gif{height:min(38vh,320px);border:5px solid;background:var(--pink);position:relative;display:grid;place-items:center;overflow:hidden}.gif:before{content:"👏👏👏";position:absolute;font-size:68px}.gif img{position:relative;width:100%;height:100%;object-fit:cover}.card h2{font-size:clamp(28px,5vw,50px);line-height:.93;letter-spacing:-.045em;margin:22px 0 10px}.card p{font:700 15px Arial}.card button{padding:14px 22px;border:4px solid;border-radius:999px;background:var(--cyan);box-shadow:5px 5px var(--ink);cursor:pointer;font:900 18px Arial}.confetti,.claps{position:absolute;inset:0;overflow:hidden;pointer-events:none}.confetti i{position:absolute;top:-25px;width:12px;height:22px;border:2px solid;animation:fall var(--d) var(--delay) linear both}.claps span{position:absolute;top:-90px;font-size:55px;animation:clapfall 2.8s var(--delay) ease-in both}@keyframes arrive{from{opacity:0}}@keyframes pop{from{opacity:0;transform:scale(.45) rotate(8deg)}}@keyframes fall{to{transform:translateY(115vh) rotate(720deg)}}@keyframes clapfall{to{transform:translateY(120vh) rotate(35deg)}}@media(max-width:600px){.page{padding-top:70px}h1{line-height:.86}.card{padding:18px;box-shadow:8px 8px var(--pink),14px 14px var(--cyan)}.gif{height:250px}}
  </style>
</head>
<body>
  <main class="page"><section class="hero"><div class="tag">FEELING DANGEROUSLY UNDER-CELEBRATED?</div><h1>PRESS FOR<br><span>INSTANT GLORY</span></h1><p class="sub">Scientifically unverified. Emotionally essential.</p><button id="mainButton">✦ I NEED APPRECIATION ✦</button><p class="warning">WARNING: MAY CAUSE CONFIDENCE, SPARKLE, AND UNREASONABLE SWAGGER.</p></section></main>
  <div class="overlay" id="overlay" aria-live="polite"><div class="confetti" id="confetti"></div><div class="claps" id="claps"></div><section class="card"><div class="ribbon" id="ribbon">OFFICIAL VERDICT</div><div class="gif"><img id="gif" alt="Enthusiastic animated applause"></div><h2 id="message"></h2><p>Absolutely everybody agrees. No further questions.</p><button id="encore">ENCORE! ENCORE!</button></section></div>
  <script>
    const compliments=["A LEGEND HAS REQUESTED RECOGNITION.","HONESTLY? ICONIC BEHAVIOUR.","YOUR TALENT HAS BEEN REPORTED TO THE AUTHORITIES.","THE CROWD IS LOSING ITS TINY MIND.","SOMEONE GET THIS GENIUS A CAPE.","YOU DID THE THING. MAGNIFICENTLY.","BREAKING NEWS: YOU ARE CRUSHING IT."];
    const gifs=["https://media1.tenor.com/m/Y9g5HkKGldEAAAAd/%E6%89%8B%E3%82%92%E3%81%9F%E3%81%9F%E3%81%8F-%E6%8B%8D%E6%89%8B.gif","https://media1.tenor.com/m/BCFxFPGds_YAAAAd/family-guy-peter-griffin.gif"];let count=0;
    function applause(){const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;const c=new AC;for(let n=0;n<12;n++){const b=c.createBuffer(1,c.sampleRate*.07,c.sampleRate),d=b.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/d.length,3);const s=c.createBufferSource(),f=c.createBiquadFilter(),g=c.createGain();f.type="bandpass";f.frequency.value=1200+Math.random()*900;g.gain.value=.2;s.buffer=b;s.connect(f).connect(g).connect(c.destination);s.start(c.currentTime+n*.055+Math.random()*.04)}setTimeout(()=>c.close(),1600)}
    function celebrate(){count++;document.querySelector(".card").style.animation="none";void document.querySelector(".card").offsetWidth;document.querySelector(".card").style.animation="";document.getElementById("message").textContent=compliments[(count-1)%compliments.length];document.getElementById("gif").src=gifs[(count-1)%gifs.length];document.getElementById("ribbon").textContent="OFFICIAL VERDICT #"+count;document.getElementById("overlay").classList.add("show");document.getElementById("mainButton").textContent="✦ I NEED MORE APPRECIATION ✦";const colors=["#fff500","#ff4fd8","#2ef2ff","#9dff32","#ff7a00"],box=document.getElementById("confetti"),claps=document.getElementById("claps");box.innerHTML="";claps.innerHTML="";for(let i=0;i<90;i++){const p=document.createElement("i");p.style.left=Math.random()*100+"%";p.style.background=colors[i%colors.length];p.style.setProperty("--delay",Math.random()*.6+"s");p.style.setProperty("--d",1.7+Math.random()*1.6+"s");box.appendChild(p)}for(let i=0;i<16;i++){const p=document.createElement("span");p.textContent="👏";p.style.left=i*6.25+1+"%";p.style.setProperty("--delay",i*.07+"s");claps.appendChild(p)}applause()}
    document.getElementById("mainButton").onclick=celebrate;document.getElementById("encore").onclick=celebrate;
  </script>
</body>
</html>
