<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Besprechungsraum</title>

<!-- PWA: Manifest + Theme-Farbe -->
<link rel="manifest" href="./manifest.json">
<meta name="theme-color" content="#FFFFFF">

<!-- iOS braucht eigene Meta-Tags, ignoriert das Manifest teilweise -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="apple-touch-icon" href="./icon-192.png">

<link rel="stylesheet" href="./styles.css">

</head>
<body>

  <header>
    <div class="brand">
      <img src="./coredat-mark.svg" alt="Coredat">
      <div class="room-name">
        Besprechungsraum
        <span id="lastUpdate">wird geladen …</span>
        <span class="offline-badge" id="offlineBadge">Offline – letzter Stand</span>
      </div>
    </div>
    <div style="display:flex; align-items:center;">
      <div class="clock" id="clock">--:--</div>
      <button id="funModeBtn" title="Fun-Modus">🎈</button>
      <button id="fullscreenBtn" title="Vollbild umschalten">⛶</button>
    </div>
  </header>

  <div class="status-hero" id="statusHero">
    <div class="status-icon" id="statusIcon"></div>
    <div class="status-text">
      <div class="status-label">Status</div>
      <div class="status-value" id="statusValue">Lädt …</div>
      <div class="status-detail" id="statusDetail"></div>
    </div>
  </div>

  <div class="agenda">
    <div class="day-nav">
      <button class="day-nav-arrow" id="prevDayBtn" aria-label="Vorheriger Tag">‹</button>
      <div class="day-nav-label">
        <span id="dayLabel">Heute</span>
        <button class="today-btn" id="todayBtn">Heute</button>
      </div>
      <button class="day-nav-arrow" id="nextDayBtn" aria-label="Nächster Tag">›</button>
    </div>
    <div id="agendaList"></div>
  </div>

  <div class="book-bar">
    <button class="book-btn" id="openBookingBtn">Raum jetzt buchen</button>
    <button class="book-btn secondary-btn" id="planBookingBtn">Termin planen</button>
  </div>

  <div class="overlay" id="bookingOverlay">
    <div class="panel">
      <h3 id="panelTitle">Raum buchen</h3>

      <div class="field" id="scheduleFields" style="display:none">
        <label>Datum &amp; Uhrzeit</label>
        <div class="schedule-row">
          <input type="date" id="scheduleDate">
          <input type="time" id="scheduleTime">
        </div>
      </div>

      <div class="field">
        <label>Gebucht von</label>
        <select id="employeeSelect"></select>
      </div>

      <div class="field">
        <label>Dauer</label>
        <div class="duration-row" id="durationRow">
          <button class="duration-btn" data-min="15">15 Min</button>
          <button class="duration-btn selected" data-min="30">30 Min</button>
          <button class="duration-btn" data-min="60">60 Min</button>
        </div>
      </div>

      <div class="panel-actions">
        <button class="cancel-btn" id="cancelBookingBtn">Abbrechen</button>
        <button class="confirm-btn" id="confirmBookingBtn">Buchen</button>
      </div>
    </div>
  </div>

  <div class="toast" id="toast">Raum gebucht ✓</div>

<script>
  const API_BASE = "/api";
  const API_TOKEN = "__API_TOKEN__";
  const POLL_INTERVAL_MS = 30000;

  function apiFetch(path, options = {}) {
    const headers = Object.assign({}, options.headers, { "X-API-Token": API_TOKEN });
    return fetch(`${API_BASE}${path}`, Object.assign({}, options, { headers }));
  }

  let selectedDuration = 30;
  let viewedDate = new Date();
  let bookMode = "now";

  function isToday(d) {
    const t = new Date();
    return d.getFullYear() === t.getFullYear() && d.getMonth() === t.getMonth() && d.getDate() === t.getDate();
  }

  function formatDateParam(d) {
    const y = d.getFullYear();
    const m = String(d.getMonth() + 1).padStart(2, "0");
    const day = String(d.getDate()).padStart(2, "0");
    return `${y}-${m}-${day}`;
  }

  function formatDayLabel(d) {
    if (isToday(d)) return "Heute";
    return d.toLocaleDateString("de-AT", { weekday: "long", day: "numeric", month: "long" });
  }

  function nextQuarterHourStr() {
    const d = new Date();
    d.setMinutes(Math.ceil(d.getMinutes() / 15) * 15, 0, 0);
    return `${String(d.getHours()).padStart(2, "0")}:${String(d.getMinutes()).padStart(2, "0")}`;
  }

  function renderDayNav() {
    document.getElementById("dayLabel").textContent = formatDayLabel(viewedDate);
    document.getElementById("todayBtn").classList.toggle("show", !isToday(viewedDate));
  }

  function updateStatusHeroVisibility() {
    document.getElementById("statusHero").style.display = isToday(viewedDate) ? "" : "none";
  }

  function dayChanged() {
    renderDayNav();
    updateStatusHeroVisibility();
    loadAgenda();
  }

  function changeDay(delta) {
    viewedDate.setDate(viewedDate.getDate() + delta);
    dayChanged();
  }

  function goToToday() {
    viewedDate = new Date();
    dayChanged();
  }

  function tickClock() {
    const now = new Date();
    document.getElementById("clock").textContent =
      now.toLocaleTimeString("de-AT", { hour: "2-digit", minute: "2-digit" });
  }
  setInterval(tickClock, 1000);
  tickClock();

  // Tracks the last known health of each polled endpoint separately, so a
  // transient failure in one can't get silently overwritten (or falsely
  // clear the badge) by an unrelated call resolving around the same time.
  const apiHealth = { status: true, agenda: true };

  async function loadStatus() {
    try {
      const res = await apiFetch("/status");
      if (!res.ok) throw new Error(res.status);
      renderStatus(await res.json());
      apiHealth.status = true;
    } catch (err) {
      console.error("loadStatus failed:", err);
      apiHealth.status = false;
    }
    updateOfflineBadge();
  }

  async function loadAgenda() {
    try {
      const res = await apiFetch(`/agenda?date=${formatDateParam(viewedDate)}`);
      if (!res.ok) throw new Error(res.status);
      renderAgenda(await res.json());
      apiHealth.agenda = true;
    } catch (err) {
      console.error("loadAgenda failed:", err);
      apiHealth.agenda = false;
    }
    updateOfflineBadge();
  }

  async function loadEmployees() {
    try {
      const res = await apiFetch("/employees");
      if (!res.ok) throw new Error(res.status);
      const names = await res.json();
      const select = document.getElementById("employeeSelect");
      select.innerHTML = names.map(n => `<option value="${n}">${n}</option>`).join("");
    } catch (err) {
      // One-shot at page load, not part of the ongoing health/badge state —
      // a failure here shouldn't mark the whole app "offline".
      console.error("loadEmployees failed:", err);
    }
  }

  const ICON_FREI = `<svg viewBox="0 0 24 24" fill="none" stroke="#202D41" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg>`;
  const ICON_BELEGT = `<svg viewBox="0 0 24 24" fill="none" stroke="#202D41" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>`;

  function renderStatus(data) {
    const hero = document.getElementById("statusHero");
    const value = document.getElementById("statusValue");
    const detail = document.getElementById("statusDetail");
    const icon = document.getElementById("statusIcon");

    hero.classList.remove("frei", "belegt");

    if (data.belegt) {
      hero.classList.add("belegt");
      value.textContent = "Belegt";
      detail.textContent = `Wieder frei ab ${data.freiAb} Uhr`;
      icon.innerHTML = ICON_BELEGT;
    } else {
      hero.classList.add("frei");
      value.textContent = "Frei";
      detail.textContent = "Der Raum ist aktuell nicht belegt";
      icon.innerHTML = ICON_FREI;
    }

    document.getElementById("lastUpdate").textContent =
      "Aktualisiert " + new Date().toLocaleTimeString("de-AT", { hour: "2-digit", minute: "2-digit" });
  }

  function renderAgenda(items) {
    const list = document.getElementById("agendaList");
    if (!items.length) {
      list.innerHTML = `<div class="agenda-empty">Keine Termine an diesem Tag</div>`;
      return;
    }
    list.innerHTML = items.map(item => `
      <div class="agenda-item">
        <div class="agenda-time">${item.start}–${item.end}</div>
        <div class="agenda-info">
          <div class="agenda-title">${item.titel}</div>
          <div class="agenda-by">${item.gebuchtVon}</div>
        </div>
        ${item.loeschbar ? `<button class="delete-btn" data-id="${item.id}" title="Buchung löschen">🗑</button>` : ""}
      </div>
    `).join("");
  }

  const overlay = document.getElementById("bookingOverlay");

  document.getElementById("openBookingBtn").addEventListener("click", () => {
    bookMode = "now";
    document.getElementById("panelTitle").textContent = "Raum buchen";
    document.getElementById("scheduleFields").style.display = "none";
    overlay.classList.add("open");
  });

  document.getElementById("planBookingBtn").addEventListener("click", () => {
    bookMode = "scheduled";
    document.getElementById("panelTitle").textContent = "Termin planen";
    document.getElementById("scheduleFields").style.display = "";
    document.getElementById("scheduleDate").value = formatDateParam(viewedDate);
    document.getElementById("scheduleTime").value = nextQuarterHourStr();
    overlay.classList.add("open");
  });

  document.getElementById("cancelBookingBtn").addEventListener("click", () => {
    overlay.classList.remove("open");
  });

  document.querySelectorAll(".duration-btn").forEach(btn => {
    btn.addEventListener("click", () => {
      document.querySelectorAll(".duration-btn").forEach(b => b.classList.remove("selected"));
      btn.classList.add("selected");
      selectedDuration = parseInt(btn.dataset.min, 10);
    });
  });

  document.getElementById("confirmBookingBtn").addEventListener("click", async () => {
    const employee = document.getElementById("employeeSelect").value;
    const payload = { employee, durationMinutes: selectedDuration };

    if (bookMode === "scheduled") {
      const date = document.getElementById("scheduleDate").value;
      const time = document.getElementById("scheduleTime").value;
      if (!date || !time) {
        showToast("Bitte Datum und Uhrzeit wählen");
        return;
      }
      payload.startDateTime = `${date}T${time}:00`;
    }

    try {
      const res = await apiFetch("/book", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload)
      });

      if (res.status === 409) {
        const data = await res.json().catch(() => ({}));
        showToast(`Zeitraum bereits belegt: ${data.detail || "Konflikt"}`);
        return;
      }
      if (!res.ok) throw new Error(res.status);

      overlay.classList.remove("open");
      showToast(`Raum für ${employee} gebucht (${selectedDuration} Min)`);
      loadStatus();
      loadAgenda();
    } catch (err) {
      overlay.classList.remove("open");
      showToast("Buchung fehlgeschlagen – bitte erneut versuchen");
    }
  });

  document.getElementById("agendaList").addEventListener("click", async (e) => {
    const btn = e.target.closest(".delete-btn");
    if (!btn) return;
    if (!confirm("Diese Buchung wirklich löschen?")) return;

    try {
      const res = await apiFetch(`/booking/${btn.dataset.id}`, { method: "DELETE" });
      if (res.status === 403) {
        showToast("Diese Buchung kann nicht gelöscht werden");
        return;
      }
      if (!res.ok) throw new Error(res.status);
      showToast("Buchung gelöscht");
      loadAgenda();
      loadStatus();
    } catch (err) {
      showToast("Löschen fehlgeschlagen");
    }
  });

  document.getElementById("prevDayBtn").addEventListener("click", () => changeDay(-1));
  document.getElementById("nextDayBtn").addEventListener("click", () => changeDay(1));
  document.getElementById("todayBtn").addEventListener("click", goToToday);

  const agendaEl = document.querySelector(".agenda");
  let touchStartX = 0;
  let touchStartY = 0;
  agendaEl.addEventListener("touchstart", (e) => {
    touchStartX = e.changedTouches[0].clientX;
    touchStartY = e.changedTouches[0].clientY;
  }, { passive: true });
  agendaEl.addEventListener("touchend", (e) => {
    const dx = e.changedTouches[0].clientX - touchStartX;
    const dy = e.changedTouches[0].clientY - touchStartY;
    if (Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy)) {
      changeDay(dx < 0 ? 1 : -1);
    }
  }, { passive: true });

  function showToast(msg) {
    const toast = document.getElementById("toast");
    toast.textContent = msg + " ✓";
    toast.classList.add("show");
    setTimeout(() => toast.classList.remove("show"), 2500);
  }

  document.getElementById("funModeBtn").addEventListener("click", () => {
    window.location.href = "./fun.html";
  });

  document.getElementById("fullscreenBtn").addEventListener("click", () => {
    if (!document.fullscreenElement) {
      document.documentElement.requestFullscreen().catch(() => {});
    } else {
      document.exitFullscreen();
    }
  });

  function updateOfflineBadge() {
    // Driven only by apiHealth (real /api fetch outcomes) — navigator.onLine
    // is unreliable (notably on Android) and was dropped for the same
    // reason a shared true/false argument was: both let one call's timing
    // clobber another's, leaving the badge stuck offline even when the app
    // was working correctly.
    const offline = !apiHealth.status || !apiHealth.agenda;
    document.getElementById("offlineBadge").classList.toggle("show", offline);
  }

  if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => {
      navigator.serviceWorker.register("./sw.js").catch(() => {});
    });
  }

  renderDayNav();
  updateStatusHeroVisibility();
  loadStatus();
  loadAgenda();
  loadEmployees();
  setInterval(loadStatus, POLL_INTERVAL_MS);
  setInterval(loadAgenda, POLL_INTERVAL_MS);
</script>

</body>
</html>
