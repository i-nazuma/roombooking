<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Besprechungsraum</title>

<!-- PWA: Manifest + Theme-Farbe -->
<link rel="manifest" href="./manifest.json">
<meta name="theme-color" content="#FFFFFF">

<!-- iOS braucht eigene Meta-Tags, ignoriert das Manifest teilweise -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="apple-touch-icon" href="./icon-192.png">

<style>
  :root {
    /* Coredat Color Codes */
    --creme: #F4F3F0;
    --light-blue: #D1E6FF;
    --grey: #B8B8B8;
    --blue: #1B56C4;
    --text: #474747;
    --dark-blue: #202D41;
    --green: #A1C9AC;
    --pink: #F2BAEC;
    --yellow: #FFC55D;
    --purple: #CCB9F0;
    --white: #FFFFFF;

    --border: rgba(32,45,65,0.10);
    --radius: 20px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body { height: 100%; overflow: hidden; }

  body {
    background: var(--creme);
    color: var(--dark-blue);
    font-family: -apple-system, "Segoe UI", Roboto, system-ui, sans-serif;
    display: flex;
    flex-direction: column;
    -webkit-user-select: none;
    user-select: none;
  }

  header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 24px 40px;
    flex-shrink: 0;
    background: var(--white);
    border-bottom: 1px solid var(--border);
    color: var(--dark-blue);
  }

  .brand {
    display: flex;
    align-items: center;
    gap: 16px;
  }

  .brand img {
    height: 40px;
    width: auto;
    flex-shrink: 0;
  }

  .room-name {
    font-size: 20px;
    font-weight: 600;
    letter-spacing: 0.2px;
  }

  .room-name span {
    display: block;
    font-size: 13px;
    font-weight: 400;
    color: var(--text);
    margin-top: 4px;
  }

  .offline-badge {
    display: none;
    font-size: 12px;
    font-weight: 600;
    color: var(--dark-blue);
    background: var(--yellow);
    padding: 4px 10px;
    border-radius: 8px;
    margin-top: 6px;
  }

  .offline-badge.show { display: inline-block; }

  .clock {
    font-family: "SF Mono", "Consolas", monospace;
    font-size: 22px;
    font-variant-numeric: tabular-nums;
    color: var(--dark-blue);
  }

  #fullscreenBtn {
    background: transparent;
    border: 1px solid var(--grey);
    color: var(--dark-blue);
    width: 40px;
    height: 40px;
    border-radius: 10px;
    margin-left: 16px;
    cursor: pointer;
    font-size: 16px;
  }

  .status-hero {
    position: relative;
    margin: 32px 40px 28px 40px;
    padding: 44px 48px;
    border-radius: var(--radius);
    background: var(--white);
    border: 1px solid var(--border);
    display: flex;
    align-items: center;
    gap: 28px;
    overflow: hidden;
    transition: background 0.4s ease;
  }

  .status-icon {
    flex-shrink: 0;
    width: 84px;
    height: 84px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    background: rgba(32,45,65,0.08);
  }

  .status-icon svg { width: 42px; height: 42px; }

  .status-text { display: flex; flex-direction: column; gap: 6px; }

  .status-hero.frei {
    background: var(--green);
    border-color: rgba(32,45,65,0.12);
  }

  .status-hero.belegt {
    background: var(--yellow);
    border-color: rgba(32,45,65,0.12);
  }

  .status-hero.frei .status-icon,
  .status-hero.belegt .status-icon {
    background: rgba(32,45,65,0.14);
  }

  .status-label {
    font-size: 15px;
    text-transform: uppercase;
    letter-spacing: 1.5px;
    color: var(--text);
  }

  .status-hero.frei .status-label,
  .status-hero.belegt .status-label {
    color: var(--dark-blue);
    opacity: 0.75;
  }

  .status-value {
    font-size: 64px;
    font-weight: 700;
    color: var(--dark-blue);
    line-height: 1.1;
  }

  .status-detail {
    font-size: 19px;
    color: var(--text);
  }

  .agenda {
    margin: 0 40px;
    flex: 1;
    overflow-y: auto;
  }

  .agenda h2 {
    font-size: 14px;
    text-transform: uppercase;
    letter-spacing: 1.5px;
    color: var(--text);
    margin-bottom: 14px;
  }

  .agenda-item {
    position: relative;
    display: flex;
    align-items: center;
    gap: 20px;
    padding: 16px 20px 16px 24px;
    background: var(--white);
    border: 1px solid var(--border);
    border-radius: 14px;
    margin-bottom: 10px;
    overflow: hidden;
  }

  .agenda-item::before {
    content: "";
    position: absolute;
    left: 0; top: 0; bottom: 0;
    width: 4px;
    background: var(--purple);
  }

  .agenda-time {
    font-family: "SF Mono", "Consolas", monospace;
    font-variant-numeric: tabular-nums;
    font-size: 15px;
    color: var(--text);
    min-width: 108px;
  }

  .agenda-title {
    font-size: 16px;
    font-weight: 500;
    color: var(--dark-blue);
  }

  .agenda-by {
    font-size: 13px;
    color: var(--text);
    margin-top: 2px;
  }

  .agenda-empty {
    color: var(--text);
    font-size: 15px;
    padding: 20px;
    text-align: center;
  }

  .book-bar {
    padding: 24px 40px 32px 40px;
    flex-shrink: 0;
  }

  .book-btn {
    width: 100%;
    padding: 22px;
    border: none;
    border-radius: 16px;
    background: var(--blue);
    color: var(--white);
    font-size: 19px;
    font-weight: 700;
    cursor: pointer;
  }

  .book-btn:active { opacity: 0.85; }

  .overlay {
    position: fixed;
    inset: 0;
    background: rgba(32,45,65,0.45);
    display: flex;
    align-items: flex-end;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.25s ease;
    z-index: 10;
  }

  .overlay.open { opacity: 1; pointer-events: auto; }

  .panel {
    width: 100%;
    background: var(--white);
    border-radius: 24px 24px 0 0;
    padding: 36px 40px 44px 40px;
    transform: translateY(100%);
    transition: transform 0.3s ease;
    position: relative;
  }

  .panel::before {
    content: "";
    position: absolute;
    top: 14px;
    left: 50%;
    transform: translateX(-50%);
    width: 44px;
    height: 5px;
    border-radius: 3px;
    background: var(--pink);
  }

  .overlay.open .panel { transform: translateY(0); }

  .panel h3 {
    font-size: 20px;
    margin-bottom: 24px;
    color: var(--dark-blue);
  }

  .field { margin-bottom: 20px; }

  .field label {
    display: block;
    font-size: 13px;
    color: var(--text);
    text-transform: uppercase;
    letter-spacing: 1px;
    margin-bottom: 8px;
  }

  select {
    width: 100%;
    padding: 16px;
    border-radius: 12px;
    border: 1px solid var(--grey);
    background: var(--creme);
    color: var(--dark-blue);
    font-size: 17px;
  }

  .duration-row { display: flex; gap: 10px; }

  .duration-btn {
    flex: 1;
    padding: 14px;
    border-radius: 12px;
    border: 1px solid var(--grey);
    background: var(--creme);
    color: var(--text);
    font-size: 16px;
    cursor: pointer;
  }

  .duration-btn.selected {
    border-color: var(--purple);
    background: rgba(204,185,240,0.35);
    color: #5b3fa0;
    font-weight: 600;
  }

  .panel-actions {
    display: flex;
    gap: 12px;
    margin-top: 28px;
  }

  .panel-actions button {
    flex: 1;
    padding: 18px;
    border-radius: 14px;
    border: none;
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
  }

  .cancel-btn { background: var(--creme); color: var(--text); }
  .confirm-btn { background: var(--blue); color: var(--white); }

  .toast {
    position: fixed;
    top: 30px;
    left: 50%;
    transform: translateX(-50%) translateY(-20px);
    background: var(--blue);
    color: var(--white);
    padding: 16px 28px;
    border-radius: 14px;
    font-weight: 600;
    opacity: 0;
    transition: all 0.3s ease;
    z-index: 20;
  }

  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
</style>
</head>
<body>

  <header>
    <div class="brand">
      <img src="./coredat-mark.svg" alt="Coredat">
      <div class="room-name">
        Besprechungsraum
        <span id="lastUpdate">wird geladen …</span>
        <span class="offline-badge" id="offlineBadge">Offline – letzter Stand</span>
      </div>
    </div>
    <div style="display:flex; align-items:center;">
      <div class="clock" id="clock">--:--</div>
      <button id="fullscreenBtn" title="Vollbild umschalten">⛶</button>
    </div>
  </header>

  <div class="status-hero" id="statusHero">
    <div class="status-icon" id="statusIcon"></div>
    <div class="status-text">
      <div class="status-label">Status</div>
      <div class="status-value" id="statusValue">Lädt …</div>
      <div class="status-detail" id="statusDetail"></div>
    </div>
  </div>

  <div class="agenda">
    <h2>Heutige Termine</h2>
    <div id="agendaList"></div>
  </div>

  <div class="book-bar">
    <button class="book-btn" id="openBookingBtn">Raum jetzt buchen</button>
  </div>

  <div class="overlay" id="bookingOverlay">
    <div class="panel">
      <h3>Raum buchen</h3>

      <div class="field">
        <label>Gebucht von</label>
        <select id="employeeSelect"></select>
      </div>

      <div class="field">
        <label>Dauer</label>
        <div class="duration-row" id="durationRow">
          <button class="duration-btn" data-min="15">15 Min</button>
          <button class="duration-btn selected" data-min="30">30 Min</button>
          <button class="duration-btn" data-min="60">60 Min</button>
        </div>
      </div>

      <div class="panel-actions">
        <button class="cancel-btn" id="cancelBookingBtn">Abbrechen</button>
        <button class="confirm-btn" id="confirmBookingBtn">Buchen</button>
      </div>
    </div>
  </div>

  <div class="toast" id="toast">Raum gebucht ✓</div>

<script>
  const API_BASE = "/api";
  const POLL_INTERVAL_MS = 30000;

  let selectedDuration = 30;

  function tickClock() {
    const now = new Date();
    document.getElementById("clock").textContent =
      now.toLocaleTimeString("de-AT", { hour: "2-digit", minute: "2-digit" });
  }
  setInterval(tickClock, 1000);
  tickClock();

  async function loadStatus() {
    try {
      const res = await fetch(`${API_BASE}/status`);
      if (!res.ok) throw new Error(res.status);
      renderStatus(await res.json());
      updateOfflineBadge(false);
    } catch (err) {
      updateOfflineBadge(true);
    }
  }

  async function loadAgenda() {
    try {
      const res = await fetch(`${API_BASE}/agenda`);
      if (!res.ok) throw new Error(res.status);
      renderAgenda(await res.json());
      updateOfflineBadge(false);
    } catch (err) {
      updateOfflineBadge(true);
    }
  }

  async function loadEmployees() {
    try {
      const res = await fetch(`${API_BASE}/employees`);
      if (!res.ok) throw new Error(res.status);
      const names = await res.json();
      const select = document.getElementById("employeeSelect");
      select.innerHTML = names.map(n => `<option value="${n}">${n}</option>`).join("");
    } catch (err) {
      updateOfflineBadge(true);
    }
  }

  const ICON_FREI = `<svg viewBox="0 0 24 24" fill="none" stroke="#202D41" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg>`;
  const ICON_BELEGT = `<svg viewBox="0 0 24 24" fill="none" stroke="#202D41" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>`;

  function renderStatus(data) {
    const hero = document.getElementById("statusHero");
    const value = document.getElementById("statusValue");
    const detail = document.getElementById("statusDetail");
    const icon = document.getElementById("statusIcon");

    hero.classList.remove("frei", "belegt");

    if (data.belegt) {
      hero.classList.add("belegt");
      value.textContent = "Belegt";
      detail.textContent = `Wieder frei ab ${data.freiAb} Uhr`;
      icon.innerHTML = ICON_BELEGT;
    } else {
      hero.classList.add("frei");
      value.textContent = "Frei";
      detail.textContent = "Der Raum ist aktuell nicht belegt";
      icon.innerHTML = ICON_FREI;
    }

    document.getElementById("lastUpdate").textContent =
      "Aktualisiert " + new Date().toLocaleTimeString("de-AT", { hour: "2-digit", minute: "2-digit" });
  }

  function renderAgenda(items) {
    const list = document.getElementById("agendaList");
    if (!items.length) {
      list.innerHTML = `<div class="agenda-empty">Keine Termine für heute</div>`;
      return;
    }
    list.innerHTML = items.map(item => `
      <div class="agenda-item">
        <div class="agenda-time">${item.start}–${item.end}</div>
        <div>
          <div class="agenda-title">${item.titel}</div>
          <div class="agenda-by">${item.gebuchtVon}</div>
        </div>
      </div>
    `).join("");
  }

  const overlay = document.getElementById("bookingOverlay");

  document.getElementById("openBookingBtn").addEventListener("click", () => {
    overlay.classList.add("open");
  });

  document.getElementById("cancelBookingBtn").addEventListener("click", () => {
    overlay.classList.remove("open");
  });

  document.querySelectorAll(".duration-btn").forEach(btn => {
    btn.addEventListener("click", () => {
      document.querySelectorAll(".duration-btn").forEach(b => b.classList.remove("selected"));
      btn.classList.add("selected");
      selectedDuration = parseInt(btn.dataset.min, 10);
    });
  });

  document.getElementById("confirmBookingBtn").addEventListener("click", async () => {
    const employee = document.getElementById("employeeSelect").value;

    try {
      const res = await fetch(`${API_BASE}/book`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ employee, durationMinutes: selectedDuration })
      });
      if (!res.ok) throw new Error(res.status);

      overlay.classList.remove("open");
      showToast(`Raum für ${employee} gebucht (${selectedDuration} Min)`);
      loadStatus();
      loadAgenda();
    } catch (err) {
      overlay.classList.remove("open");
      showToast("Buchung fehlgeschlagen – bitte erneut versuchen");
    }
  });

  function showToast(msg) {
    const toast = document.getElementById("toast");
    toast.textContent = msg + " ✓";
    toast.classList.add("show");
    setTimeout(() => toast.classList.remove("show"), 2500);
  }

  document.getElementById("fullscreenBtn").addEventListener("click", () => {
    if (!document.fullscreenElement) {
      document.documentElement.requestFullscreen().catch(() => {});
    } else {
      document.exitFullscreen();
    }
  });

  function updateOfflineBadge(forceOffline) {
    const offline = forceOffline !== undefined ? forceOffline : !navigator.onLine;
    document.getElementById("offlineBadge").classList.toggle("show", offline);
  }
  window.addEventListener("online", () => updateOfflineBadge());
  window.addEventListener("offline", () => updateOfflineBadge());
  updateOfflineBadge();

  if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => {
      navigator.serviceWorker.register("./sw.js").catch(() => {});
    });
  }

  loadStatus();
  loadAgenda();
  loadEmployees();
  setInterval(loadStatus, POLL_INTERVAL_MS);
  setInterval(loadAgenda, POLL_INTERVAL_MS);
</script>

</body>
</html>
